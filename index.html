<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kuis 30 Detik</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="timer-wrapper">
  <svg width="90" height="90">
    <circle cx="45" cy="45" r="40"
      stroke="#eee"
      stroke-width="8"
      fill="none"/>
    <circle id="progressCircle"
      cx="45"
      cy="45"
      r="40"
      stroke="crimson"
      stroke-width="8"
      fill="none"
      stroke-dasharray="251"
      stroke-dashoffset="0"
      transform="rotate(-90 45 45)"/>
  </svg>
  <div id="timerText">30</div>
</div>

<div class="container">
  <p id="passage"></p>
  <h3 id="question"></h3>
  <div id="options"></div>
  <p id="progress"></p>
</div>

<script src="script.js"></script>
</body>
</html>
