<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kuis Seni Kriya</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen active" id="startScreen">
  <h1>Kuis Seni Kriya</h1>
  <button onclick="startQuiz()">Mulai Quiz</button>
</div>

<div class="timer-wrapper">
  <svg width="100" height="100">
    <circle cx="50" cy="50" r="45"
      stroke="#eee"
      stroke-width="8"
      fill="none"/>
    <circle id="progressCircle"
      cx="50"
      cy="50"
      r="45"
      stroke="#ff4757"
      stroke-width="8"
      fill="none"
      stroke-dasharray="283"
      stroke-dashoffset="0"
      transform="rotate(-90 50 50)"/>
  </svg>
  <div id="timerText">30</div>
</div>

<div class="screen" id="quizScreen">
  <div class="container">
    <p id="passage"></p>
    <h2 id="question"></h2>
    <div id="options"></div>
    <p id="progress"></p>
  </div>
</div>

<div class="screen" id="resultScreen">
  <h1 id="finalScore"></h1>
  <button onclick="restartQuiz()">Main Lagi</button>
</div>

<script src="script.js"></script>
</body>
</html>
